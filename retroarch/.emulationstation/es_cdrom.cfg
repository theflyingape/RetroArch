<?xml version="1.0" encoding="UTF-8"?>
<!-- Rob's *SUPER* Console of retrosystems -->
<systemList>
  <system>
    <name>segacd</name>
    <fullname>Mega CD</fullname>
    <manufacturer>Sega</manufacturer>
    <release>1991</release>
    <hardware>extension</hardware>
    <path>/retroarch/roms/Sega CD</path>
    <extension>.cue .iso .cso .zip .7z .chd .m3u</extension>
    <command>gamemoderun retroarch --appendconfig="/retroarch/play.cfg|/retroarch/ES.cfg|/retroarch/one-shot.cfg|/retroarch/cheevos.cfg" -L %CORE% %ROM%</command>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core>genesis_plus_gx</core>
        </cores>
      </emulator>
    </emulators>
    <platform>segacd</platform>
    <theme>segacd</theme>
  </system>
  <system>
    <name>gamecube</name>
    <fullname>GameCube</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>2001</release>
    <hardware>console</hardware>
    <path>/retroarch/roms/GameCube</path>
    <extension>.gcz .iso .ciso .wbfs .wad .rvz .wia .m3u .zip .7z</extension>
    <command>gamemoderun retroarch --appendconfig="/retroarch/play.cfg|/retroarch/ES.cfg|/retroarch/one-shot.cfg|/retroarch/cheevos.cfg" -L %CORE% %ROM%</command>
    <emulators>
      <emulator name="dolphin">
        <core>dolphin</core>
      </emulator>
      <emulator name="libretro">
        <cores>
          <core incompatible_extensions=".zip .7z">dolphin</core>
        </cores>
      </emulator>
    </emulators>
    <platform>gc</platform>
    <theme>gc</theme>
  </system>
