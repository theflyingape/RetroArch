<?xml version="1.0" encoding="UTF-8"?>
<!-- Rob's *SUPER* Console of retrosystems -->
<systemList>
  <system>
    <name>gba</name>
    <fullname>Game Boy Advance</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>2001</release>
    <hardware>portable</hardware>
    <path>/retroarch/roms/Nintendo Gameboy Advance</path>
    <extension>.gba .zip .7z</extension>
    <command>gamemoderun retroarch --appendconfig="/retroarch/play.cfg|/retroarch/HD.cfg|/retroarch/one-shot.cfg|/retroarch/cheevos.cfg" -L %CORE% %ROM%</command>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core>gpsp</core>
        </cores>
      </emulator>
    </emulators>
    <platform>gba</platform>
    <theme>gba</theme>
  </system>
  <system>
    <name>psp</name>
    <fullname>PlayStation Portable</fullname>
    <manufacturer>Sony</manufacturer>
    <release>2004</release>
    <hardware>portable</hardware>
    <path>/retroarch/roms/PSP</path>
    <extension>.iso .cso .pbp .elf .prx .chd .zip .7z</extension>
    <command>gamemoderun retroarch --appendconfig="/retroarch/play.cfg|/retroarch/HD.cfg|/retroarch/one-shot.cfg|/retroarch/cheevos.cfg" -L %CORE% %ROM%</command>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core>ppsspp</core>
        </cores>
      </emulator>
      <emulator name="ppsspp"/>
    </emulators>
    <platform>psp</platform>
    <theme>psp</theme>
  </system>
</systemList>
