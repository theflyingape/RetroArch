<?xml version="1.0" encoding="UTF-8"?>
<systemList>
  <system>
    <name>apple2</name>
    <fullname>Apple II</fullname>
    <manufacturer>Apple</manufacturer>
    <release>1977</release>
    <hardware>computer</hardware>
    <path>/retroarch/roms/MAME/apple2p</path>
    <extension>.cmd .nib .do .po .dsk .woz .m3u .zip</extension>
    <command>gamemoderun retroarch -L %CORE% %ROM%</command>
    <platform>apple2</platform>
    <theme>apple2</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core>mame</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>c20</name>
    <fullname>VIC-20</fullname>
    <manufacturer>Commodore</manufacturer>
    <release>1980</release>
    <hardware>computer</hardware>
    <path>/retroarch/roms/VIC20/FLOPPY</path>
    <extension>.m3u .nib .a0 .b0 .crt .d64 .d81 .prg .tap .t64 .zip</extension>
    <command>gamemoderun retroarch --appendconfig="/retroarch/play.cfg|/retroarch/ES.cfg|/retroarch/one-shot.cfg|/retroarch/cheevos.cfg" -L %CORE% %ROM%</command>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core>vice_xvic</core>
        </cores>
      </emulator>
    </emulators>
    <platform>c20</platform>
    <theme>c20</theme>
  </system>
  <system>
    <name>c64</name>
    <fullname>Commodore 64</fullname>
    <manufacturer>Commodore</manufacturer>
    <release>1982</release>
    <hardware>computer</hardware>
    <path>/retroarch/roms/C64/FLOPPY</path>
    <extension>.crt .d64 .g64 .nib .prg .t64 .m3u .zip .7z</extension>
    <command>gamemoderun retroarch --appendconfig="/retroarch/play.cfg|/retroarch/ES.cfg|/retroarch/one-shot.cfg|/retroarch/cheevos.cfg" -L %CORE% %ROM%</command>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core>vice_x64sc</core>
        </cores>
      </emulator>
    </emulators>
    <platform>c64</platform>
    <theme>c64</theme>
  </system>
</systemList>
