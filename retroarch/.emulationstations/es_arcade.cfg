<?xml version="1.0" encoding="UTF-8"?>
<systemList>
  <system>
    <name>mame</name>
    <fullname>MAME</fullname>
    <manufacturer>Arcade</manufacturer>
    <release>1976</release>
    <hardware>arcade</hardware>
    <path>/retroarch/roms/MAME 2003-Plus</path>
    <extension>.zip .7z</extension>
    <command>gamemoderun retroarch --appendconfig="/retroarch/play.cfg|/retroarch/ES.cfg|/retroarch/one-shot.cfg" -L %CORE% %ROM%</command>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core>mame2003_plus</core>
          <core>mame</core>
        </cores>
      </emulator>
    </emulators>
    <platform>arcade</platform>
    <theme>mame</theme>
  </system>
  <system>
    <name>daphne</name>
    <fullname>Laserdisc</fullname>
    <manufacturer>Arcade</manufacturer>
    <release>1983</release>
    <hardware>arcade</hardware>
    <path>/retroarch/roms/Daphne</path>
    <extension>.daphne .singe .7z .zip .rar .squashfs</extension>
    <command>gamemoderun /retroarch/roms/Daphne/boot.sh %ROM%</command>
    <emulators>
      <emulator name="hypseus">
        <cores>
          <core default="true">hypseus</core>
        </cores>
      </emulator>
    </emulators>
    <platform>arcade</platform>
    <theme>daphne</theme>
  </system>
  <system>
    <name>fbneo</name>
    <fullname>Final Burn Alpha</fullname>
    <manufacturer>Arcade</manufacturer>
    <release>1990</release>
    <hardware>arcade</hardware>
    <path>/retroarch/roms/Final Burn Alpha</path>
    <extension>.zip .7z</extension>
    <command>gamemoderun retroarch --appendconfig="/retroarch/play.cfg|/retroarch/ES.cfg|/retroarch/one-shot.cfg" -L %CORE% %ROM%</command>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core>fbneo</core>
        </cores>
      </emulator>
    </emulators>
    <platform>arcade</platform>
    <theme>fbneo</theme>
  </system>
</systemList>
